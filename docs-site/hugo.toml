baseURL = "https://gograph.identuum.ai/"
locale = "en-us"
title = "gograph – Go Call Graph, Static Analysis & CI Architecture CLI"
theme = "PaperMod"
relativeURLs = false
canonifyURLs = false

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Local Go static analysis, call-graph, blast-radius, test-selection, and CI architecture-gate CLI, with a built-in stdio MCP server."
  author = "Ozgur Demir"
  images = ["/images/gograph-social-preview.png"]
  defaultTheme = "auto"
  ShowThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  disableAnchoredHeadings = false
  comments = false

  homeInfoParams = { Title = "gograph", Content = "Local Go call-graph, blast-radius, and CI architecture-gate CLI, with a built-in stdio MCP server." }

  [params.schema]
    publisherType = "Person"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/ozgurcd/gograph"

[menu]
  [[menu.main]]
    name = "Get Started"
    url = "/docs/getting-started/"
    weight = 1
  [[menu.main]]
    name = "Commands"
    url = "/docs/command-reference/"
    weight = 2
  [[menu.main]]
    name = "CI Gates"
    url = "/docs/ci-architecture-gates/"
    weight = 3
  [[menu.main]]
    name = "Comparisons"
    url = "/docs/comparisons/"
    weight = 4
  [[menu.main]]
    name = "Workflows"
    url = "/docs/workflows/"
    weight = 5
  [[menu.main]]
    name = "MCP / AI"
    url = "/docs/agent-integration/"
    weight = 6
  [[menu.main]]
    name = "Demo"
    url = "/demo/"
    weight = 7
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/ozgurcd/gograph"
    weight = 8

