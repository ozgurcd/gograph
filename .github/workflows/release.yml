name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish without rewriting it
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  GORELEASER_VERSION: 'v2.17.0'
  MCP_PUBLISHER_VERSION: 'v1.7.9'
  MCP_PUBLISHER_LINUX_AMD64_SHA256: 'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac'

jobs:
  test-proof:
    uses: ozgurcd/gograph/.github/workflows/test-proof.yml@main
    permissions:
      actions: read
      contents: read
    with:
      ref: ${{ inputs.tag || github.ref }}

  verify:
    name: Verify release candidate
    needs: test-proof
    if: ${{ !cancelled() }}
    # Every gate lives in checks.yml; the release tag adds the release-candidate gates.
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      release-tag: ${{ inputs.tag || github.ref_name }}
      # The race suite is skipped only if this is the commit checks.yml checks out.
      tested-commit: ${{ needs.test-proof.outputs.verified == 'true' && needs.test-proof.outputs.commit || '' }}

  release:
    name: Publish GitHub release and Homebrew formula
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ozgurcd/lictor/.github/actions/go-toolchain@fda0c2afaa765f190b7e331113a71570db802199
      - name: Rebuild and verify immutable MCP bundles
        run: |
          go run ./cmd/mcpb-release build --version "${{ needs.verify.outputs.version }}" --output .release-mcpb
          go run ./cmd/mcpb-release render-server --version "${{ needs.verify.outputs.version }}" --input .release-mcpb --output "$RUNNER_TEMP/server.json"
          cmp server.json "$RUNNER_TEMP/server.json"
          go run ./cmd/mcpb-release verify --version "${{ needs.verify.outputs.version }}" --input .release-mcpb --server server.json

      - name: Inspect existing GitHub release
        id: release_state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(go run ./cmd/mcpb-release github-release-state \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --server server.json)"
          case "$state" in
            missing) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            matching) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected release state: $state" >&2; exit 1 ;;
          esac

      - name: Run GoReleaser
        if: steps.release_state.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published GitHub assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(go run ./cmd/mcpb-release github-release-state \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --server server.json)" = matching

      - name: Generate Homebrew cask for an existing matching release
        if: steps.release_state.outputs.publish == 'false'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish

      - name: Reconcile and verify Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cask_path="dist/homebrew/Casks/gograph.rb"
          test -s "$cask_path"
          go run ./cmd/mcpb-release rewrite-homebrew-cask --input "$cask_path" --output "$cask_path"
          desired_version="${{ needs.verify.outputs.version }}"
          grep -Fq "version \"$desired_version\"" "$cask_path"
          published_checksums="$RUNNER_TEMP/published-checksums.txt"
          curl --fail --location --silent --show-error \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/checksums.txt" \
            --output "$published_checksums"
          for asset in \
            gograph_Darwin_arm64.tar.gz \
            gograph_Darwin_x86_64.tar.gz \
            gograph_Linux_arm64.tar.gz \
            gograph_Linux_x86_64.tar.gz; do
            local_hash="$(awk -v name="$asset" '$2 == name { print $1 }' dist/checksums.txt)"
            published_hash="$(awk -v name="$asset" '$2 == name { print $1 }' "$published_checksums")"
            test -n "$local_hash" && test -n "$published_hash"
            # GoReleaser deliberately emits the Homebrew runtime interpolation
            # `v#{version}` here, while the version stanza above pins its value.
            grep -Fq "/releases/download/v#{version}/$asset" "$cask_path"
            test "$(grep -Fc "sha256 \"$local_hash\"" "$cask_path")" = 1
            # A recovery run rebuilds archives only to regenerate the cask. Go
            # build/archive bytes are not promised to reproduce across runner
            # instances, so bind the cask to the immutable published assets.
            sed -i "s/sha256 \"$local_hash\"/sha256 \"$published_hash\"/" "$cask_path"
            grep -Fq "sha256 \"$published_hash\"" "$cask_path"
          done
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          gh auth setup-git
          gh repo clone ozgurcd/homebrew-tap "$tap_dir"
          for existing in "$tap_dir/Casks/gograph.rb" "$tap_dir/Formula/gograph.rb"; do
            [[ -f "$existing" ]] || continue
            remote_version="$(sed -n 's/^  version "\([^"]*\)"/\1/p' "$existing")"
            if [[ -z "$remote_version" ]]; then
              echo "existing Homebrew definition has no parseable version: $existing" >&2
              exit 1
            fi
            if [[ "$remote_version" != "$desired_version" ]]; then
              newest="$(printf '%s\n' "$desired_version" "$remote_version" | sort -V | tail -n 1)"
              if [[ "$newest" == "$remote_version" ]]; then
                echo "refusing to downgrade Homebrew from $remote_version to $desired_version" >&2
                exit 1
              fi
            fi
          done
          mkdir -p "$tap_dir/Casks"
          cp "$cask_path" "$tap_dir/Casks/gograph.rb"
          migration_path="$tap_dir/tap_migrations.json"
          if [[ -f "$migration_path" ]]; then
            jq -S '. + {"gograph":"gograph"}' "$migration_path" > "$migration_path.next"
          else
            jq -n -S '{"gograph":"gograph"}' > "$migration_path.next"
          fi
          mv "$migration_path.next" "$migration_path"
          rm -f "$tap_dir/Formula/gograph.rb"
          git -C "$tap_dir" add --all
          if ! git -C "$tap_dir" diff --cached --quiet; then
            git -C "$tap_dir" config user.name github-actions
            git -C "$tap_dir" config user.email github-actions@github.com
            git -C "$tap_dir" commit -m "chore: update gograph cask to $desired_version"
            git -C "$tap_dir" push origin HEAD:main
          else
            echo "Homebrew cask and migration already match"
          fi
          remote_path="$RUNNER_TEMP/gograph.rb"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            repos/ozgurcd/homebrew-tap/contents/Casks/gograph.rb > "$remote_path"
          cmp "$cask_path" "$remote_path"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            repos/ozgurcd/homebrew-tap/contents/tap_migrations.json | \
            jq -e '.gograph == "gograph"' >/dev/null
          if gh api repos/ozgurcd/homebrew-tap/contents/Formula/gograph.rb >/dev/null 2>&1; then
            echo "obsolete Homebrew formula still exists after cask migration" >&2
            exit 1
          fi

  registry-preflight:
    name: Verify Registry publication inputs
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.registry_state.outputs.publish }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: ozgurcd/lictor/.github/actions/go-toolchain@fda0c2afaa765f190b7e331113a71570db802199
      - name: Verify released MCP bundles and inspect Registry state
        id: registry_state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(go run ./cmd/mcpb-release github-release-state \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --server server.json)" = matching
          state="$(go run ./cmd/mcpb-release registry-state --server server.json)"
          case "$state" in
            missing) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            matching|pending) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected Registry state: $state" >&2; exit 1 ;;
          esac

  registry-publish:
    name: Publish official MCP Registry metadata
    needs: [verify, release, registry-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install pinned MCP publisher
        if: needs.registry-preflight.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version 2>&1 | grep -Fq 'mcp-publisher 1.7.9'

      - name: Authenticate with GitHub OIDC
        if: needs.registry-preflight.outputs.publish == 'true'
        run: "$RUNNER_TEMP/mcp-publisher login github-oidc"

      - name: Publish Registry metadata
        if: needs.registry-preflight.outputs.publish == 'true'
        run: "$RUNNER_TEMP/mcp-publisher publish server.json"

  registry-verify:
    name: Verify active Registry publication
    needs: [verify, release, registry-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: ozgurcd/lictor/.github/actions/go-toolchain@fda0c2afaa765f190b7e331113a71570db802199
      - name: Verify active Registry entry
        run: |
          test "$(go run ./cmd/mcpb-release registry-state --server server.json --wait 2m)" = matching
