name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '37 2 * * *'

permissions: {}

concurrency:
  # A newer push to a pull request supersedes its running checks.
  # Main and nightly runs get their own group and are never cancelled.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  release-tag:
    # A main commit that carries a release tag is verified by the Release
    # workflow, which runs every gate in checks.yml plus the release gates.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    outputs:
      tagged: ${{ steps.lookup.outputs.tagged }}
    steps:
      # No checkout. Any failure reports "not tagged", so the checks run.
      - id: lookup
        shell: bash
        run: |
          set -uo pipefail
          tagged=false
          if refs="$(git ls-remote --tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" 'v*')"; then
            while read -r sha ref; do
              tag="${ref#refs/tags/}"
              tag="${tag%'^{}'}"
              if [[ "$sha" == "$GITHUB_SHA" && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
                echo "Release tag $tag points at $GITHUB_SHA; the Release workflow verifies this commit."
                tagged=true
              fi
            done <<< "$refs"
          else
            echo "::warning::Could not list release tags; running the checks."
          fi
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"

  test-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # On a main push the local file is main's own, so it is the trusted lookup.
    uses: ./.github/workflows/test-proof.yml
    permissions:
      actions: read
      contents: read
    with:
      ref: ${{ github.sha }}

  checks:
    needs: [release-tag, test-proof]
    # PR and nightly checks do not depend on a source-controlled lookup output.
    if: ${{ !cancelled() && needs.release-tag.outputs.tagged != 'true' }}
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      # Nightly, and a main push whose identical tree already passed every
      # gate, only refresh the time-dependent vulnerability scans.
      vulnerability-only: ${{ github.event_name == 'schedule' || needs.test-proof.outputs.verified == 'true' }}

  build-and-test:
    # The required status check on main. It reports the outcome of the shared
    # checks under one stable name. always(): a skipped job would count as a
    # passed required check.
    needs: [release-tag, checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
          TAGGED: ${{ needs.release-tag.outputs.tagged }}
        shell: bash
        run: |
          if [[ "$RESULT" == success ]]; then
            exit 0
          fi
          if [[ "$RESULT" == skipped && "$TAGGED" == true ]]; then
            echo "The Release workflow verifies this tagged commit."
            exit 0
          fi
          echo "checks finished with: $RESULT" >&2
          exit 1

  tested-commit:
    # Separate runner, no checkout, no source outputs, no artifact claims.
    name: tested-commit-${{ github.sha }}
    needs: [release-tag, test-proof, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && github.event_name != 'schedule' && needs.test-proof.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: ':'
