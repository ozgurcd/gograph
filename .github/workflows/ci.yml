name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '37 2 * * *'

permissions:
  contents: read
  actions: read

jobs:
  test-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Inline on main so the first PR does not require an unmerged reusable file.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    steps:
      - uses: actions/github-script@v8
        id: proof
        env:
          TARGET_REF: ${{ github.sha }}
        with:
          script: |
            core.setOutput('verified', 'false');
            if (context.eventName === 'pull_request') return;
            const repo = context.repo;
            const fullName = `${repo.owner}/${repo.repo}`;
            const request = {timeout: 10000};
            const isSHA = sha => typeof sha === 'string' && /^[a-f0-9]{40}$/.test(sha);
            const getCommit = async sha => (await github.rest.git.getCommit({
              ...repo, commit_sha: sha, request
            })).data;
            const blob = async (ref, path) => {
              const {data} = await github.rest.repos.getContent({...repo, ref, path, request});
              if (data.type !== 'file' || !isSHA(data.sha)) {
                throw new Error('Not a regular workflow file');
              }
              return data.sha;
            };
            // Read the whole bounded list before accepting evidence from any page.
            // Missing pages, unstable counts, duplicate rows, and caps all fail closed.
            const listAll = async (fetchPage, key) => {
              const rows = [];
              let total;
              for (let page = 1; page <= 5; page++) {
                const {data} = await fetchPage(page);
                if (!Number.isSafeInteger(data.total_count) || data.total_count < 0 ||
                    data.total_count > 500 || (total !== undefined && total !== data.total_count)) {
                  throw new Error('Unverifiable list count');
                }
                total = data.total_count;
                const part = data[key];
                if (!Array.isArray(part) || part.length !== Math.min(100, total - rows.length)) {
                  throw new Error('Incomplete list');
                }
                rows.push(...part);
                if (rows.length === total) {
                  const ids = rows.map(row => row.id);
                  if (ids.some(id => !Number.isSafeInteger(id) || id <= 0) ||
                      new Set(ids).size !== ids.length) throw new Error('Unverifiable list identity');
                  return rows;
                }
              }
              throw new Error('List exceeds page cap');
            };
            const identity = run => JSON.stringify([
              run.id, run.run_attempt, run.status, run.conclusion, run.event, run.path,
              run.head_sha, run.head_branch, run.repository?.full_name, run.head_repository?.full_name
            ]);
            try {
              const {data: target} = await github.rest.repos.getCommit({
                ...repo, ref: process.env.TARGET_REF, request
              });
              if (!isSHA(target.sha) || !isSHA(target.commit?.tree?.sha)) throw new Error('Invalid target');
              core.setOutput('commit', target.sha);
              const {data: main} = await github.rest.repos.getCommit({...repo, ref: 'main', request});
              if (!isSHA(main.sha)) throw new Error('Invalid trusted revision');
              const policyPaths = ['.github/workflows/ci.yml', '.github/workflows/test-proof.yml'];
              const policy = await Promise.all(policyPaths.map(path => blob(main.sha, path)));
              const runs = await listAll(page => github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'ci.yml', status: 'success', per_page: 100, page, request
              }), 'workflow_runs');
              for (const listed of runs) {
                if (listed.id === context.runId) continue;
                const {data: run} = await github.rest.actions.getWorkflowRun({
                  ...repo, run_id: listed.id, request
                });
                // PR head_sha does not identify GitHub's executed merge commit.
                // Accept only main pushes: their API head_sha identifies both source and workflow.
                if (run.id !== listed.id || run.status !== 'completed' || run.conclusion !== 'success' ||
                    run.event !== 'push' || run.head_branch !== 'main' ||
                    run.path !== policyPaths[0] || !isSHA(run.head_sha) ||
                    !Number.isSafeInteger(run.run_attempt) || run.run_attempt <= 0 ||
                    run.repository?.full_name !== fullName || run.head_repository?.full_name !== fullName) continue;
                const testedSHA = run.head_sha;
                // Bind policy to the actual producer, before consulting any job or marker name.
                const producedPolicy = await Promise.all(policyPaths.map(path => blob(testedSHA, path)));
                if (producedPolicy.some((sha, i) => sha !== policy[i])) continue;
                const tested = await getCommit(testedSHA);
                if (!isSHA(tested.tree?.sha) || tested.tree.sha !== target.commit.tree.sha) continue;
                const jobs = await listAll(page => github.request(
                  'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {
                    ...repo, run_id: run.id, attempt_number: run.run_attempt,
                    per_page: 100, page, request
                  }), 'jobs');
                const builds = jobs.filter(job => job.name === 'build-and-test');
                const markers = jobs.filter(job => typeof job.name === 'string' && job.name.startsWith('tested-commit-'));
                if (builds.length !== 1 || markers.length !== 1 ||
                    builds[0].conclusion !== 'success' || markers[0].conclusion !== 'success' ||
                    markers[0].name !== `tested-commit-${testedSHA}`) continue;
                const tests = builds[0].steps.filter(step => step.name === 'Run Race Tests');
                if (tests.length !== 1 || tests[0].conclusion !== 'success') continue;
                const {data: finalRun} = await github.rest.actions.getWorkflowRun({
                  ...repo, run_id: run.id, request
                });
                if (identity(finalRun) !== identity(run)) continue;
                core.info(`Reusing race suite from run ${run.id}, attempt ${run.run_attempt}, commit ${testedSHA}, tree ${tested.tree.sha}`);
                core.setOutput('verified', 'true');
                return;
              }
              core.info('No suitable tested tree; run the full race suite.');
            } catch (error) {
              // Do not print request headers or API response bodies.
              core.warning('Proof unavailable; run the full race suite.');
            }

  build-and-test:
    needs: test-proof
    # PR and nightly tests do not depend on a source-controlled lookup output.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - uses: ozgurcd/lictor/.github/actions/go-toolchain@fda0c2afaa765f190b7e331113a71570db802199
    - name: Verify Dependencies
      run: go mod verify

    - name: Verify go.mod is tidy
      run: go mod tidy -diff

    - name: Check formatting
      shell: bash
      run: |
        unformatted="$(gofmt -l .)"
        if [[ -n "$unformatted" ]]; then
          echo "The following Go files are not formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Build
      run: go build -v ./...

    - name: Run Race Tests
      if: github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.test-proof.outputs.verified != 'true'
      run: go test -count=1 -race ./...

    - name: Vet
      run: go vet ./...

    - name: Install pinned Grype
      id: grype
      uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
      with:
        grype-version: v0.116.1

    - name: Staticcheck
      run: make staticcheck

    - name: GolangCI-Lint
      run: make lint

    - name: Vulnerability Check
      env:
        GRYPE: ${{ steps.grype.outputs.cmd }}
      run: |
        make govulncheck
        make vulnerability-check

    - name: Build and structurally validate all MCP bundles
      shell: bash
      run: |
        set -euo pipefail
        make mcpb-build
        version="$(awk -F ' = ' '$1 == "current_version" { print $2 }' .bumpversion.cfg)"
        test -n "$version"
        go run ./cmd/mcpb-release render-server \
          --version "$version" \
          --input .release-mcpb \
          --output "$RUNNER_TEMP/server.json"
        make mcpb-verify MCPB_SERVER="$RUNNER_TEMP/server.json"

    - name: Smoke-test the native MCP bundle
      run: make mcpb-smoke

    - name: Install pinned Hugo
      env:
        HUGO_VERSION: '0.164.0'
      run: |
        wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -O "$RUNNER_TEMP/hugo.deb"
        sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

    - name: Build documentation site
      run: make docs-check

  tested-commit:
    # Separate runner, no checkout, no source outputs, no artifact claims.
    name: tested-commit-${{ github.sha }}
    needs: [test-proof, build-and-test]
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' && (github.event_name != 'push' || needs.test-proof.outputs.verified != 'true') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: ':'
