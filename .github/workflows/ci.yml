name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'

    - name: Verify Dependencies
      run: go mod verify

    - name: Verify go.mod is tidy
      run: go mod tidy -diff

    - name: Check formatting
      shell: bash
      run: |
        unformatted="$(gofmt -l .)"
        if [[ -n "$unformatted" ]]; then
          echo "The following Go files are not formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Build
      run: go build -v ./...

    - name: Run Tests
      run: go test -count=1 -v ./...

    - name: Run Race Tests
      run: go test -count=1 -race ./...

    - name: Vet
      run: go vet ./...

    - name: Install pinned Grype
      id: grype
      uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
      with:
        grype-version: v0.116.1

    - name: Staticcheck
      run: make staticcheck

    - name: GolangCI-Lint
      run: make lint

    - name: Vulnerability Check
      env:
        GRYPE: ${{ steps.grype.outputs.cmd }}
      run: |
        make govulncheck
        make vulnerability-check

    - name: Build and structurally validate all MCP bundles
      shell: bash
      run: |
        set -euo pipefail
        make mcpb-build
        version="$(awk -F ' = ' '$1 == "current_version" { print $2 }' .bumpversion.cfg)"
        test -n "$version"
        go run ./cmd/mcpb-release render-server \
          --version "$version" \
          --input .release-mcpb \
          --output "$RUNNER_TEMP/server.json"
        make mcpb-verify MCPB_SERVER="$RUNNER_TEMP/server.json"

    - name: Smoke-test the native MCP bundle
      run: make mcpb-smoke

    - name: Install pinned Hugo
      env:
        HUGO_VERSION: '0.164.0'
      run: |
        wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -O "$RUNNER_TEMP/hugo.deb"
        sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

    - name: Build documentation site
      run: make docs-check
