name: Checks

# The one definition of every verification gate. CI and Release both call it,
# so a gate is added, pinned, or removed here and nowhere else. The one
# exception is the release artifact scan: it is a GoReleaser build hook in
# .goreleaser.yaml, so it scans the exact binaries the release job publishes.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to verify.
        required: true
        type: string
      vulnerability-only:
        description: Run only the vulnerability scans.
        default: false
        type: boolean
      tested-commit:
        description: >-
          Commit whose tree already passed every gate in a full CI run, as
          resolved by test-proof. When this is the checked-out commit, only the
          vulnerability scans and the release-candidate gates run.
        default: ''
        type: string
      release-tag:
        description: Release tag to validate. Adds the release-candidate gates.
        default: ''
        type: string
      full-race:
        description: >-
          Run every package under the race detector. Otherwise only the
          packages with in-process concurrency run with -race and the rest run
          plain. Release runs always use the full race suite.
        default: false
        type: boolean
    outputs:
      version:
        description: Release version without the leading v. Set on release runs only.
        value: ${{ jobs.verify.outputs.version }}

permissions:
  contents: read

env:
  # Keep verifier versions in this workflow: a release dispatch may
  # intentionally check out an older immutable release tag.
  HUGO_VERSION: '0.164.0'
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GOVULNCHECK_VERSION: 'v1.3.0'

jobs:
  # test-proof.yml identifies this job by name and its race step by name.
  verify:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Reject a vulnerability-only release verification
        if: ${{ inputs.vulnerability-only && inputs.release-tag != '' }}
        run: exit 1

      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ozgurcd/lictor/.github/actions/go-toolchain@fda0c2afaa765f190b7e331113a71570db802199

      - name: Resolve checked-out commit
        id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate tag, versions, and main ancestry
        id: metadata
        if: ${{ inputs.release-tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be an exact semantic version (vX.Y.Z): $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          config_version="$(awk -F ' = ' '$1 == "current_version" { print $2 }' .bumpversion.cfg)"
          plugin_version="$(jq -er '.version' plugin.json)"
          server_version="$(jq -er '.version' server.json)"
          for declared in "$config_version" "$plugin_version" "$server_version"; do
            if [[ "$declared" != "$version" ]]; then
              echo "tag $tag does not match declared version $declared" >&2
              exit 1
            fi
          done
          tagged_commit="$(git rev-parse "${tag}^{}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$tagged_commit" != "$checked_out_commit" ]]; then
            echo "checked-out commit $checked_out_commit is not tagged commit $tagged_commit" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/main; then
            echo "tagged commit $tagged_commit is not contained in origin/main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify dependencies and formatting
        if: ${{ !inputs.vulnerability-only && steps.head.outputs.commit != inputs.tested-commit }}
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # The MCPB packaging packages have no concurrent production code (only
      # sync.Once), and under -race their zip and hash work ran 6-20x slower
      # (about 3.5 CPU-minutes). They run every test without the race
      # detector, alongside the race run of every other package.
      #
      # internal/cli runs its tests one after another and is the longest
      # package, so its tests are dealt round-robin into separate processes.
      # On 4 cores, 2 shards cut the step from 172 s to 147 s; 3 or 4 were
      # slower because the cores are already saturated.
      # The full race suite runs nightly and for releases. Its step name is
      # what test-proof requires before a release reuses an earlier run.
      - name: Run Race Tests
        if: ${{ !inputs.vulnerability-only && steps.head.outputs.commit != inputs.tested-commit && (inputs.full-race || inputs.release-tag != '') }}
        shell: bash
        env:
          CLI_TEST_SHARDS: '2'
        run: |
          set -euo pipefail
          module=github.com/ozgurcd/gograph
          plain_packages=(./internal/mcpbundle ./cmd/mcpb-release)
          mapfile -t race_packages < <(go list ./... | grep -vxF -e "$module/internal/mcpbundle" -e "$module/cmd/mcpb-release" -e "$module/internal/cli")
          mapfile -t cli_tests < <(go test -race -list '.*' ./internal/cli | grep -E '^(Test|Example|Fuzz)')
          test "${#race_packages[@]}" -gt 0
          test "${#cli_tests[@]}" -gt 0
          pids=()
          go test -count=1 "${plain_packages[@]}" &
          pids+=("$!")
          for ((shard = 0; shard < CLI_TEST_SHARDS; shard++)); do
            names=()
            for ((i = shard; i < ${#cli_tests[@]}; i += CLI_TEST_SHARDS)); do
              names+=("${cli_tests[i]}")
            done
            go test -count=1 -race -run "^($(IFS='|'; echo "${names[*]}"))\$" ./internal/cli &
            pids+=("$!")
          done
          go test -count=1 -race "${race_packages[@]}"
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

      # Pull requests and main pushes run every test, but only the packages
      # with in-process concurrency under -race: a data race needs goroutines
      # sharing memory, and -race made the rest (internal/cli above all) 3-12x
      # slower without finding anything. internal/session coordinates
      # processes through file locks, which the race detector cannot observe.
      # The nightly and release runs still race every package. The guard
      # fails when a package outside RACE_PACKAGES starts using goroutines or
      # sync primitives, so the list cannot silently fall behind; add the
      # package to RACE_PACKAGES, or to RACE_EXEMPT with a reason.
      - name: Run Tests (race on concurrent packages)
        if: ${{ !inputs.vulnerability-only && steps.head.outputs.commit != inputs.tested-commit && !inputs.full-race && inputs.release-tag == '' }}
        shell: bash
        env:
          # Packages with goroutines, channels shared across goroutines, or locks.
          RACE_PACKAGES: >-
            internal/mcp internal/search internal/precise internal/workspace
            internal/scanner internal/memorylimit
          # sync use that does not need a per-change race run:
          # internal/cli: one RWMutex for MCP serving state, raced nightly.
          # internal/mcpbundle: sync.Once only (see the full suite above).
          RACE_EXEMPT: internal/cli internal/mcpbundle
        run: |
          set -euo pipefail
          module=github.com/ozgurcd/gograph
          read -r -a race_list <<< "$RACE_PACKAGES"
          read -r -a exempt_list <<< "$RACE_EXEMPT"
          listed() {
            local relative="$1"; shift
            local entry
            for entry in "$@"; do [[ "$entry" == "$relative" ]] && return 0; done
            return 1
          }
          race_packages=()
          plain_packages=()
          unlisted=()
          while read -r path dir imports; do
            relative="${path#"$module"}"
            relative="${relative#/}"
            [[ -z "$relative" ]] && relative=.
            if listed "$relative" "${race_list[@]}"; then
              race_packages+=("./$relative")
              continue
            fi
            plain_packages+=("./$relative")
            listed "$relative" "${exempt_list[@]}" && continue
            concurrent=false
            for imported in ${imports//,/ }; do
              case "$imported" in
                sync|sync/atomic|golang.org/x/sync/*) concurrent=true ;;
              esac
            done
            if ! $concurrent && grep -qE '(^|[^[:alnum:]_.])go[[:space:]]+(func[[:space:]]*\(|[[:alpha:]_][[:alnum:]_.]*\()' $(go list -f '{{range .GoFiles}}{{$.Dir}}/{{.}} {{end}}' "$path"); then
              concurrent=true
            fi
            $concurrent && unlisted+=("$relative")
          done < <(go list -f '{{.ImportPath}} {{.Dir}} {{join .Imports ","}}' ./...)
          if ((${#unlisted[@]} > 0)); then
            echo "These packages use goroutines or sync but are not in RACE_PACKAGES or RACE_EXEMPT: ${unlisted[*]}" >&2
            exit 1
          fi
          test "${#race_packages[@]}" -eq "${#race_list[@]}"
          test "${#plain_packages[@]}" -gt 0
          go test -count=1 "${plain_packages[@]}" &
          plain_pid=$!
          go test -count=1 -race "${race_packages[@]}"
          wait "$plain_pid"

      - name: Vet
        if: ${{ !inputs.vulnerability-only && steps.head.outputs.commit != inputs.tested-commit }}
        run: go vet ./...

      - name: Install pinned Grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          grype-version: v0.116.1

      - name: Run static analysis
        if: ${{ !inputs.vulnerability-only && steps.head.outputs.commit != inputs.tested-commit }}
        run: |
          staticcheck ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION} run ./...

      # The first scan used to spend about 90 s downloading the vulnerability
      # database. Restore today's copy (or the newest older one); Grype still
      # checks for a newer database before scanning, so results are never
      # older than without the cache. The nightly run saves it on main.
      - name: Select the Grype database cache key
        id: grype-db
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        shell: bash
        run: |
          set -euo pipefail
          version="$("$GRYPE" version | awk '$1 == "Version:" { print $2 }')"
          test -n "$version"
          prefix="grype-db-${RUNNER_OS}-${version}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore the Grype vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grype-db
          key: ${{ steps.grype-db.outputs.key }}
          restore-keys: ${{ steps.grype-db.outputs.prefix }}

      - name: Run vulnerability scans
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
          make vulnerability-check

      - name: Build, validate, and smoke-test MCP bundles
        if: ${{ !inputs.vulnerability-only && steps.head.outputs.commit != inputs.tested-commit }}
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if [[ -z "$version" ]]; then
            version="$(awk -F ' = ' '$1 == "current_version" { print $2 }' .bumpversion.cfg)"
          fi
          test -n "$version"
          server="$RUNNER_TEMP/server.json"
          go run ./cmd/mcpb-release build --version "$version" --output .release-mcpb
          go run ./cmd/mcpb-release render-server --version "$version" --input .release-mcpb --output "$server"
          if [[ -n "$RELEASE_VERSION" ]]; then
            # A release publishes the committed server.json, so it must equal the fresh render.
            cmp server.json "$server"
            server=server.json
          fi
          go run ./cmd/mcpb-release verify --version "$version" --input .release-mcpb --server "$server"
          go run ./cmd/mcpb-release smoke --version "$version" --input .release-mcpb

      - name: Preflight immutable Registry version
        if: ${{ inputs.release-tag != '' }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(go run ./cmd/mcpb-release registry-state --server server.json)"
          case "$state" in
            missing|matching|pending) ;;
            *) echo "unexpected Registry state: $state" >&2; exit 1 ;;
          esac

      - name: Build documentation
        if: ${{ !inputs.vulnerability-only && steps.head.outputs.commit != inputs.tested-commit }}
        shell: bash
        run: |
          set -euo pipefail
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -O "$RUNNER_TEMP/hugo.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo --source docs-site --renderToMemory --minify
