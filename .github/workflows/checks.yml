name: Checks

# The one definition of every verification gate. CI and Release both call it,
# so a gate is added, pinned, or removed here and nowhere else.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to verify.
        required: true
        type: string
      vulnerability-only:
        description: Run only the vulnerability scans.
        default: false
        type: boolean
      tested-commit:
        description: >-
          Commit whose tree already passed the race suite, as resolved by
          test-proof. The suite is skipped only when this is the checked-out commit.
        default: ''
        type: string
      release-tag:
        description: Release tag to validate. Adds the release-candidate gates.
        default: ''
        type: string
    outputs:
      version:
        description: Release version without the leading v. Set on release runs only.
        value: ${{ jobs.verify.outputs.version }}

permissions:
  contents: read

env:
  # Keep verifier versions in this workflow: a release dispatch may
  # intentionally check out an older immutable release tag.
  GORELEASER_VERSION: 'v2.17.0'
  HUGO_VERSION: '0.164.0'
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GOVULNCHECK_VERSION: 'v1.3.0'

jobs:
  # test-proof.yml identifies this job by name and its race step by name.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Reject a vulnerability-only release verification
        if: ${{ inputs.vulnerability-only && inputs.release-tag != '' }}
        run: exit 1

      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ozgurcd/lictor/.github/actions/go-toolchain@fda0c2afaa765f190b7e331113a71570db802199

      - name: Resolve checked-out commit
        id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate tag, versions, and main ancestry
        id: metadata
        if: ${{ inputs.release-tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be an exact semantic version (vX.Y.Z): $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          config_version="$(awk -F ' = ' '$1 == "current_version" { print $2 }' .bumpversion.cfg)"
          plugin_version="$(jq -er '.version' plugin.json)"
          server_version="$(jq -er '.version' server.json)"
          for declared in "$config_version" "$plugin_version" "$server_version"; do
            if [[ "$declared" != "$version" ]]; then
              echo "tag $tag does not match declared version $declared" >&2
              exit 1
            fi
          done
          tagged_commit="$(git rev-parse "${tag}^{}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$tagged_commit" != "$checked_out_commit" ]]; then
            echo "checked-out commit $checked_out_commit is not tagged commit $tagged_commit" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/main; then
            echo "tagged commit $tagged_commit is not contained in origin/main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify dependencies and formatting
        if: ${{ !inputs.vulnerability-only }}
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        if: ${{ !inputs.vulnerability-only }}
        run: go build -v ./...

      - name: Run Race Tests
        if: ${{ !inputs.vulnerability-only && steps.head.outputs.commit != inputs.tested-commit }}
        run: go test -count=1 -race ./...

      - name: Vet
        if: ${{ !inputs.vulnerability-only }}
        run: go vet ./...

      - name: Install pinned Grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          grype-version: v0.116.1

      - name: Run static analysis
        if: ${{ !inputs.vulnerability-only }}
        run: |
          staticcheck ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION} run ./...

      - name: Run vulnerability scans
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
          make vulnerability-check

      - name: Build, validate, and smoke-test MCP bundles
        if: ${{ !inputs.vulnerability-only }}
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if [[ -z "$version" ]]; then
            version="$(awk -F ' = ' '$1 == "current_version" { print $2 }' .bumpversion.cfg)"
          fi
          test -n "$version"
          server="$RUNNER_TEMP/server.json"
          go run ./cmd/mcpb-release build --version "$version" --output .release-mcpb
          go run ./cmd/mcpb-release render-server --version "$version" --input .release-mcpb --output "$server"
          if [[ -n "$RELEASE_VERSION" ]]; then
            # A release publishes the committed server.json, so it must equal the fresh render.
            cmp server.json "$server"
            server=server.json
          fi
          go run ./cmd/mcpb-release verify --version "$version" --input .release-mcpb --server "$server"
          go run ./cmd/mcpb-release smoke --version "$version" --input .release-mcpb

      - name: Preflight immutable Registry version
        if: ${{ inputs.release-tag != '' }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(go run ./cmd/mcpb-release registry-state --server server.json)"
          case "$state" in
            missing|matching|pending) ;;
            *) echo "unexpected Registry state: $state" >&2; exit 1 ;;
          esac

      - name: Build documentation
        if: ${{ !inputs.vulnerability-only }}
        shell: bash
        run: |
          set -euo pipefail
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -O "$RUNNER_TEMP/hugo.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo --source docs-site --renderToMemory --minify

      - name: Validate GoReleaser configuration and artifacts
        if: ${{ inputs.release-tag != '' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish

      - name: Scan exact release archives
        if: ${{ inputs.release-tag != '' }}
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: make scan-release-artifacts RELEASE_DIST=dist
