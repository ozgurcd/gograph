name: Look up tested tree

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    outputs:
      verified:
        value: ${{ jobs.lookup.outputs.verified }}
      commit:
        value: ${{ jobs.lookup.outputs.commit }}

permissions:
  actions: read
  contents: read

jobs:
  lookup:
    # Callers use @main. Never execute checked-out code in this job.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
      commit: ${{ steps.proof.outputs.commit }}
    steps:
      - uses: actions/github-script@v8
        id: proof
        env:
          TARGET_REF: ${{ inputs.ref }}
        with:
          script: |
            core.setOutput('verified', 'false');
            if (context.eventName === 'pull_request') return;
            const repo = context.repo;
            const fullName = `${repo.owner}/${repo.repo}`;
            const request = {timeout: 10000};
            const getCommit = async sha => (await github.rest.git.getCommit({
              ...repo, commit_sha: sha, request
            })).data;
            const blob = async (ref, path) => {
              const {data} = await github.rest.repos.getContent({...repo, ref, path, request});
              if (data.type !== 'file' || !/^[a-f0-9]{40}$/.test(data.sha)) {
                throw new Error('Not a regular workflow file');
              }
              return data.sha;
            };
            try {
              const {data: target} = await github.rest.repos.getCommit({
                ...repo, ref: process.env.TARGET_REF, request
              });
              core.setOutput('commit', target.sha);
              const {data: main} = await github.rest.repos.getCommit({...repo, ref: 'main', request});
              const policyPaths = ['.github/workflows/ci.yml', '.github/workflows/test-proof.yml'];
              const policy = await Promise.all(policyPaths.map(path => blob(main.sha, path)));
              // Bounded search: older evidence causes full tests, never a wait.
              for (let page = 1; page <= 3; page++) {
                const {data} = await github.rest.actions.listWorkflowRuns({
                  ...repo, workflow_id: 'ci.yml', status: 'success', per_page: 100, page, request
                });
                for (const listed of data.workflow_runs) {
                  if (listed.id === context.runId) continue;
                  const {data: run} = await github.rest.actions.getWorkflowRun({
                    ...repo, run_id: listed.id, request
                  });
                  if (run.status !== 'completed' || run.conclusion !== 'success' ||
                      run.path !== '.github/workflows/ci.yml' ||
                      run.repository?.full_name !== fullName ||
                      run.head_repository?.full_name !== fullName ||
                      !['pull_request', 'push', 'schedule'].includes(run.event) ||
                      (run.event !== 'pull_request' && run.head_branch !== 'main')) continue;
                  const {data: jobs} = await github.request(
                    'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {
                      ...repo, run_id: run.id, attempt_number: run.run_attempt,
                      per_page: 100, request
                    });
                  if (jobs.total_count !== jobs.jobs.length) continue;
                  const builds = jobs.jobs.filter(job => job.name === 'build-and-test');
                  const markers = jobs.jobs.filter(job => /^tested-commit-[a-f0-9]{40}$/.test(job.name));
                  if (builds.length !== 1 || markers.length !== 1 ||
                      builds[0].conclusion !== 'success' || markers[0].conclusion !== 'success') continue;
                  const tests = builds[0].steps.filter(step => step.name === 'Run Race Tests');
                  if (tests.length !== 1 || tests[0].conclusion !== 'success') continue;
                  // The isolated marker job gets github.sha from GitHub, not source outputs.
                  const testedSHA = markers[0].name.slice('tested-commit-'.length);
                  const tested = await getCommit(testedSHA);
                  if (tested.tree.sha !== target.commit.tree.sha) continue;
                  if (run.event === 'pull_request') {
                    if (tested.parents.length !== 2 || tested.parents[1].sha !== run.head_sha) continue;
                  } else if (testedSHA !== run.head_sha) continue;
                  // This fixes the test command, checkout ref, skip rules, and marker job.
                  // A changed producer workflow cannot invent another tested commit.
                  const producedPolicy = await Promise.all(policyPaths.map(path => blob(testedSHA, path)));
                  if (producedPolicy.some((sha, i) => sha !== policy[i])) continue;
                  const {data: finalRun} = await github.rest.actions.getWorkflowRun({
                    ...repo, run_id: run.id, request
                  });
                  if (finalRun.run_attempt !== run.run_attempt || finalRun.status !== 'completed' ||
                      finalRun.conclusion !== 'success') continue;
                  core.info(`Reusing race suite from run ${run.id}, attempt ${run.run_attempt}, commit ${testedSHA}, tree ${tested.tree.sha}`);
                  core.setOutput('verified', 'true');
                  return;
                }
                if (data.workflow_runs.length < 100) break;
              }
              core.info('No suitable tested tree; run the full race suite.');
            } catch (error) {
              // Do not print request headers or API response bodies.
              core.warning('Proof unavailable; run the full race suite.');
            }
