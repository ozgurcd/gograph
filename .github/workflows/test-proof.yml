name: Look up tested tree

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    outputs:
      verified:
        value: ${{ jobs.lookup.outputs.verified }}
      commit:
        value: ${{ jobs.lookup.outputs.commit }}

permissions:
  actions: read
  contents: read

jobs:
  lookup:
    # Release calls this file @main; CI calls it only on main pushes. Never execute checked-out code in this job.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
      commit: ${{ steps.proof.outputs.commit }}
    steps:
      - uses: actions/github-script@v8
        id: proof
        env:
          TARGET_REF: ${{ inputs.ref }}
        with:
          script: |
            core.setOutput('verified', 'false');
            if (context.eventName === 'pull_request') return;
            const repo = context.repo;
            const fullName = `${repo.owner}/${repo.repo}`;
            const request = {timeout: 10000};
            const isSHA = sha => typeof sha === 'string' && /^[a-f0-9]{40}$/.test(sha);
            // A producer-side object that does not exist (404) is evidence of nothing: callers
            // pass optional and skip that run. Every other failure, and any 404 on trusted main, aborts.
            const orNull = async (optional, read) => {
              try {
                return await read();
              } catch (error) {
                if (optional && error?.status === 404) return null;
                throw error;
              }
            };
            const getCommit = (sha, optional = false) => orNull(optional, async () => (
              await github.rest.git.getCommit({...repo, commit_sha: sha, request})
            ).data);
            const blob = (ref, path, optional = false) => orNull(optional, async () => {
              const {data} = await github.rest.repos.getContent({...repo, ref, path, request});
              if (data.type !== 'file' || !isSHA(data.sha)) {
                throw new Error('Not a regular workflow file');
              }
              return data.sha;
            });
            // Read the whole bounded list before accepting evidence from any page.
            // Missing pages, unstable counts, duplicate rows, and caps all fail closed.
            const listAll = async (fetchPage, key) => {
              const rows = [];
              let total;
              for (let page = 1; page <= 5; page++) {
                const {data} = await fetchPage(page);
                if (!Number.isSafeInteger(data.total_count) || data.total_count < 0 ||
                    data.total_count > 500 || (total !== undefined && total !== data.total_count)) {
                  throw new Error('Unverifiable list count');
                }
                total = data.total_count;
                const part = data[key];
                if (!Array.isArray(part) || part.length !== Math.min(100, total - rows.length)) {
                  throw new Error('Incomplete list');
                }
                rows.push(...part);
                if (rows.length === total) {
                  const ids = rows.map(row => row.id);
                  if (ids.some(id => !Number.isSafeInteger(id) || id <= 0) ||
                      new Set(ids).size !== ids.length) throw new Error('Unverifiable list identity');
                  return rows;
                }
              }
              throw new Error('List exceeds page cap');
            };
            const identity = run => JSON.stringify([
              run.id, run.run_attempt, run.status, run.conclusion, run.event, run.path,
              run.head_sha, run.head_branch, run.repository?.full_name, run.head_repository?.full_name
            ]);
            try {
              const {data: target} = await github.rest.repos.getCommit({
                ...repo, ref: process.env.TARGET_REF, request
              });
              if (!isSHA(target.sha) || !isSHA(target.commit?.tree?.sha)) throw new Error('Invalid target');
              core.setOutput('commit', target.sha);
              const {data: main} = await github.rest.repos.getCommit({...repo, ref: 'main', request});
              if (!isSHA(main.sha)) throw new Error('Invalid trusted revision');
              const policyPaths = ['.github/workflows/ci.yml', '.github/workflows/test-proof.yml', '.github/workflows/checks.yml'];
              const policy = await Promise.all(policyPaths.map(path => blob(main.sha, path)));
              const policyAt = sha => Promise.all(policyPaths.map(path => blob(sha, path, true)));
              const sameAsMain = shas => shas.every((sha, i) => sha === policy[i]);
              // Pull requests are only looked up by the heads of same-repo PRs GitHub associates with
              // the target. This narrows the search; it is not evidence, everything is re-verified.
              const {data: associated} = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...repo, commit_sha: target.sha, per_page: 100, request
              });
              if (!Array.isArray(associated) || associated.length >= 100) throw new Error('Unverifiable pull request list');
              const prHeads = [...new Set(associated
                .filter(pr => pr.base?.ref === 'main' && pr.head?.repo?.full_name === fullName && isSHA(pr.head.sha))
                .map(pr => pr.head.sha))];
              const lists = [await listAll(page => github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'ci.yml', event: 'push', branch: 'main', status: 'success',
                per_page: 100, page, request
              }), 'workflow_runs')];
              for (const head_sha of prHeads) {
                lists.push(await listAll(page => github.rest.actions.listWorkflowRuns({
                  ...repo, workflow_id: 'ci.yml', event: 'pull_request', head_sha, status: 'success',
                  per_page: 100, page, request
                }), 'workflow_runs'));
              }
              const seen = new Set();
              for (const listed of lists.flat()) {
                if (listed.id === context.runId || seen.has(listed.id)) continue;
                seen.add(listed.id);
                const {data: run} = await github.rest.actions.getWorkflowRun({
                  ...repo, run_id: listed.id, request
                });
                // A push is identified by its head_sha. A pull_request run executes GitHub's merge
                // commit, which only its marker names; that commit is bound to the run below.
                const isPush = run.event === 'push' && run.head_branch === 'main';
                const isPull = run.event === 'pull_request' && prHeads.includes(run.head_sha);
                if (run.id !== listed.id || run.status !== 'completed' || run.conclusion !== 'success' ||
                    !(isPush || isPull) ||
                    run.path !== policyPaths[0] || !isSHA(run.head_sha) ||
                    !Number.isSafeInteger(run.run_attempt) || run.run_attempt <= 0 ||
                    run.repository?.full_name !== fullName || run.head_repository?.full_name !== fullName) continue;
                // Bind policy to the producer commit, before consulting any job or marker name.
                if (!sameAsMain(await policyAt(run.head_sha))) continue;
                if (isPush) {
                  const head = await getCommit(run.head_sha, true);
                  if (!isSHA(head?.tree?.sha) || head.tree.sha !== target.commit.tree.sha) continue;
                }
                const jobs = await listAll(page => github.request(
                  'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {
                    ...repo, run_id: run.id, attempt_number: run.run_attempt,
                    per_page: 100, page, request
                  }), 'jobs');
                // checks.yml runs the suite: caller job "checks" in ci.yml, job "verify" in checks.yml.
                const builds = jobs.filter(job => job.name === 'checks / verify');
                const markers = jobs.filter(job => typeof job.name === 'string' && job.name.startsWith('tested-commit-'));
                if (builds.length !== 1 || markers.length !== 1 ||
                    builds[0].conclusion !== 'success' || markers[0].conclusion !== 'success') continue;
                const testedSHA = /^tested-commit-([a-f0-9]{40})$/.exec(markers[0].name)?.[1];
                if (!testedSHA || (isPush && testedSHA !== run.head_sha)) continue;
                const tests = builds[0].steps.filter(step => step.name === 'Run Race Tests');
                if (tests.length !== 1 || tests[0].conclusion !== 'success') continue;
                if (isPull) {
                  // The executed merge commit must carry main's policy, descend from this run's head,
                  // and have exactly the target tree.
                  if (!sameAsMain(await policyAt(testedSHA))) continue;
                  const tested = await getCommit(testedSHA, true);
                  if (!Array.isArray(tested?.parents) || tested.parents.length !== 2 ||
                      !tested.parents.some(parent => parent.sha === run.head_sha) ||
                      !isSHA(tested.tree?.sha) || tested.tree.sha !== target.commit.tree.sha) continue;
                }
                const {data: finalRun} = await github.rest.actions.getWorkflowRun({
                  ...repo, run_id: run.id, request
                });
                if (identity(finalRun) !== identity(run)) continue;
                core.info(`Reusing race suite from run ${run.id}, attempt ${run.run_attempt}, event ${run.event}, commit ${testedSHA}, tree ${target.commit.tree.sha}`);
                core.setOutput('verified', 'true');
                return;
              }
              core.info('No suitable tested tree; run the full race suite.');
            } catch (error) {
              // Do not print request headers or API response bodies.
              core.warning('Proof unavailable; run the full race suite.');
            }
